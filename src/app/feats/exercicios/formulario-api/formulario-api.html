
<h1>Formulario POST</h1>

<form (submit)="cadastrarUsuario($event)">

    <h2>ID</h2>
    <div class="input-text">  
        <input type="text" placeholder="Insira seu ID..." [formField]="usuarioForm.userId">
    </div>

    <h2>Título</h2>
    <div class="input-text"> 
        <input type="text" placeholder="Título..." [formField]="usuarioForm.title">
    </div>

    <h2>Texto</h2>
    <div class="input-text"> 
        <input type="text" placeholder="Insira o Texto..." [formField]="usuarioForm.body">
    </div>

    <button>Cadastrar</button>

</form>
